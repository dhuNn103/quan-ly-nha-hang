<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Quản lý nhà hàng</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
<style>
:root{--bg:#f4f1ea;--fg:#1e2533;--card:#fffdf8;--bd:#e3dccb;--pri:#1f3350;--mut:#7b7565;--w:#b08d4c;--ok:#6f8f6b;--bad:#a8432f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#161a24;--fg:#ece7da;--card:#1f2533;--bd:#363e52;--pri:#5a78a8;--mut:#a9a392;--w:#c9a867;--bad:#e7917f}}
:root[data-theme=dark]{--bg:#161a24;--fg:#ece7da;--card:#1f2533;--bd:#363e52;--pri:#5a78a8;--mut:#a9a392;--w:#c9a867;--bad:#e7917f}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 "Be Vietnam Pro",system-ui,sans-serif}
*{box-sizing:border-box}h3,h4{margin:.4em 0}small,.mut{color:var(--mut)}
#app{display:flex;min-height:100vh}aside{width:230px;background:var(--card);border-right:1px solid var(--bd);padding:12px;flex:none}
aside h5{margin:14px 0 4px;color:var(--mut);font-weight:600;font-size:12px}
aside a{display:block;padding:8px 10px;border-radius:8px;cursor:pointer}aside a.on{background:var(--pri);color:#fff}
main{flex:1;padding:16px;min-width:0}
button,select,input{font:inherit;padding:7px 11px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg)}
button{cursor:pointer}button.p{background:var(--pri);color:#fff;border-color:var(--pri)}button.x{color:var(--bad)}button:disabled{opacity:.4}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stats div{padding:12px;border-radius:10px;color:#fff;font-size:13px}.stats b{font-size:26px;display:block}
.pos{display:grid;grid-template-columns:1fr 2fr;gap:14px}.tabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.t{border:2px solid var(--bd);background:var(--card);border-radius:10px;padding:10px;cursor:pointer}.t.busy{border-color:var(--w)}.t.clean{border-color:#6b7fd0}.t.free{border-color:var(--ok)}
.box{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:3px 0}.tag{font-size:12px;color:var(--mut)}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:6px}
#modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:9;padding:10px}#modal.on{display:flex}
#modal>div{background:var(--bg);border-radius:12px;padding:16px;width:640px;max-width:100%;max-height:92vh;overflow:auto}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--bd);padding:6px;text-align:left}.sc{overflow-x:auto}
.late{border-color:var(--bad)!important}.login{margin:10vh auto;max-width:340px;width:100%;padding:16px}.login input{width:100%;margin:4px 0}
.err{color:var(--bad)}.qrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
@media(max-width:800px){#app{flex-direction:column}aside{width:auto}.pos{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
@media print{aside,button{display:none!important}body.pb #app{display:none!important}body.pb #modal{position:static;background:none;display:block}body.pb #modal>div{width:80mm;max-height:none;overflow:visible;background:#fff;color:#000;padding:0}.np{display:none!important}}
</style></head><body><div id="app"></div><div id="modal"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),money=n=>Math.round(n).toLocaleString('vi-VN')+'đ',tm=t=>new Date(t).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});
const K='nh_v1',R={admin:'Admin',manager:'Quản lý',waiter:'Nhân viên phục vụ',kitchen:'Nhân viên bếp'},IS={wait:'Chờ chế biến',cook:'Đang chế biến',done:'Đã hoàn thành',served:'Đã phục vụ',cancel:'Đã hủy'},TS={free:'Trống',busy:'Có khách',clean:'Đang dọn'};
const G=[['TỔNG QUAN',['pos','report']],['VẬN HÀNH NHÀ HÀNG',['menu','qr','kds','waiter']],['QUẢN TRỊ',['attendance','set']]];
const NAV={pos:['fa-table-cells-large Sơ đồ bàn & POS','admin,manager,waiter'],report:['fa-chart-column Báo cáo doanh thu','admin,manager'],menu:['fa-book-open Quản lý thực đơn','admin,manager'],qr:['fa-qrcode Quản lý mã QR bàn','admin,manager'],kds:['fa-kitchen-set Màn hình bếp KDS','admin,manager,kitchen'],waiter:['fa-mobile-screen-button Ứng dụng phục vụ','admin,manager,waiter'],set:['fa-gear Cài đặt hệ thống','admin,manager'],attendance:['fa-users Quản lý nhân viên','admin,manager,waiter,kitchen']};
function seed(){const m=[['Phở bò',55000,'Món chính','Bếp nóng'],['Bún chả',50000,'Món chính','Bếp nóng'],['Cơm rang',45000,'Món chính','Bếp nóng'],['Gỏi cuốn',35000,'Khai vị','Bếp lạnh'],['Nem rán',40000,'Khai vị','Bếp nóng'],['Cà phê sữa',30000,'Đồ uống','Quầy bar'],['Trà đá',5000,'Đồ uống','Quầy bar'],['Nước cam',35000,'Đồ uống','Quầy bar'],['Chè',25000,'Tráng miệng','Bếp lạnh']];
const u=(n,x,p,r)=>({name:n,u:x,p,role:r,st:'active',t:Date.now()});
return{users:[u('Quản trị viên','admin','Admin@123','admin'),u('Nguyễn Quản Lý','quanly','Quanly@123','manager'),u('Trần Phục Vụ','phucvu','Phucvu@123','waiter'),u('Lê Bếp','bep','Bep@12345','kitchen')],tables:[1,2,3,4,5,6,7,8].map(i=>({id:i,name:'B'+i,st:'free'})),menu:m.map((x,i)=>({id:'M'+(i+1),name:x[0],price:x[1],cat:x[2],area:x[3],st:'on'})),orders:[],inv:[],shift:null,shifts:[],cfg:{name:'Nhà hàng Demo',vat:8,svc:5,qrAuto:false,late:10,sndOrder:true,sndDone:true},seq:1,fails:{}}}
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S)S=seed();
let me=null,page='pos',cur=null,cart=[],rp='all',last=Date.now();const QR=(location.hash.match(/qr=?(\d+)/)||[])[1];
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
const modal=h=>{const m=$('#modal'),w=m.classList.contains('on'),s=m.firstChild?m.firstChild.scrollTop:0;m.innerHTML='<div>'+h+'</div>';m.classList.add('on');if(w)m.firstChild.scrollTop=s},closeM=()=>$('#modal').classList.remove('on'),can=(...r)=>me&&r.includes(me.role);
const act=o=>o.items.filter(i=>i.st!='cancel'),live=o=>o.pay!='paid'&&act(o).length>0,tOrders=t=>S.orders.filter(o=>o.table==t&&live(o)),sum=o=>act(o).reduce((s,i)=>s+i.price*i.qty,0),tTotal=t=>tOrders(t).reduce((s,o)=>s+sum(o),0);
function ost(o){if(o.status=='pending')return'Chờ xác nhận';const a=act(o);if(!a.length)return'Đã hủy';if(a.every(i=>i.st=='served'))return'Hoàn thành';if(a.some(i=>i.st=='wait'||i.st=='cook'))return'Đang xử lý';return'Đã xác nhận'}
/* ---------- Đăng nhập ---------- */
function fillLogin(u,p){const iu=$('#u'),ip=$('#p'),er=$('#er');if(iu)iu.value=u;if(ip)ip.value=p;if(er)er.textContent='';if(ip)ip.focus()}
function loginView(){const lg=logo();return`<div class="box login login-card"><div class=login-hd>${lg||'<div class=login-brand-icon><i class="fa-solid fa-utensils"></i></div>'}<h3 class=login-title>${esc(S.cfg.name)}</h3><p class=login-sub>Đăng nhập hệ thống quản lý</p></div><div class=login-form><div class=login-field><i class="fa-solid fa-user lf-ic"></i><input id=u placeholder="Tên đăng nhập" autocomplete=username onkeydown="if(event.key=='Enter')$('#p').focus()"></div><div class="login-field lpw"><i class="fa-solid fa-lock lf-ic"></i><input id=p type=password placeholder="Mật khẩu" autocomplete=current-password onkeydown="if(event.key=='Enter')login()"><button type=button class=lpw-eye aria-label="Hiện mật khẩu" title="Hiện mật khẩu" onclick="lpwTog()"><i class="fa-solid fa-eye-slash"></i></button></div><div id=er class=err></div><button type=button class="p login-btn" onclick="login()">Đăng nhập</button><div class=login-extra><a href="#" class=login-forgot onclick="alert('Vui lòng liên hệ Quản trị viên để được cấp lại mật khẩu.');return false">Quên mật khẩu?</a></div></div><div class=login-demo><div class=login-demo-lbl><i class="fa-solid fa-key"></i> Tài khoản mẫu dùng thử</div><div class=login-demo-chips><button type=button class=ld-chip onclick="fillLogin('admin','Admin@123')" title="Quản trị viên"><b>Admin</b><span>admin</span></button><button type=button class=ld-chip onclick="fillLogin('quanly','Quanly@123')" title="Quản lý"><b>Quản lý</b><span>quanly</span></button><button type=button class=ld-chip onclick="fillLogin('phucvu','Phucvu@123')" title="Nhân viên phục vụ"><b>Phục vụ</b><span>phucvu</span></button><button type=button class=ld-chip onclick="fillLogin('bep','Bep@12345')" title="Nhân viên bếp"><b>Bếp</b><span>bep</span></button></div></div></div>`}
function login(){const u=$('#u').value.trim(),p=$('#p').value,a=S.users.find(x=>x.u==u),f=S.fails[u]||{n:0,until:0},e=m=>$('#er').textContent=m;
if(a&&a.role!='admin'&&f.until>Date.now())return e('Tài khoản bị khóa 15 phút do nhập sai quá 5 lần.');
if(!a||a.p!=p){if(a&&a.role!='admin'){if(++f.n>=5){f.until=Date.now()+9e5;f.n=0}S.fails[u]=f;save()}return e('Tên đăng nhập hoặc mật khẩu không chính xác.')}
if(a.st!='active')return e('Tài khoản đã bị khóa hoặc vô hiệu hóa.');S.fails[u]={n:0,until:0};save();me=a;page=Object.keys(NAV).find(k=>NAV[k][1].includes(a.role));last=Date.now();render()}
function logout(){me=null;cart=[];render()}
setInterval(()=>{if(me&&Date.now()-last>9e5){logout();alert('Phiên đăng nhập đã hết hạn do không hoạt động.')}},3e4);addEventListener('click',()=>last=Date.now());
addEventListener('storage',e=>{if(e.key==K&&e.newValue){S=JSON.parse(e.newValue);render();if($('#modal').classList.contains('on')&&cur&&me)drawT()}});
/* ---------- Khung ---------- */
function render(){const a=$('#app');if(QR){a.innerHTML=qrView();return}if(!me){a.innerHTML=loginView();return}
a.innerHTML=`<aside><a class=cb onclick="togCol()" title="Thu gọn / mở rộng menu"><span class=ic><i class="fa-solid fa-bars"></i></span></a>${G.map(([g,ks])=>{const v=ks.filter(k=>NAV[k][1].includes(me.role));return v.length?`<h5>${g}</h5>`+v.map(k=>`<a class="${k==page?'on':''}" onclick="page='${k}';rpFb=false;mFb=false;qrFb=false;staffFb=false;bankAddFb=false;logFb=false;render()">${ic(NAV[k][0])}${bdg(k)}</a>`).join(''):''}).join('')}<h5>&nbsp;</h5><div class=ub><div class=ur><span class=av><i class="fa-solid fa-user"></i></span><span class=tx>${esc(me.name)}</span></div><button class=lob onclick="logout()" title="Đăng xuất"><i class="fa-solid fa-right-from-bracket"></i> <span class=tx>Đăng xuất</span></button></div><a class=lo onclick="logout()" title="Đăng xuất"><i class="fa-solid fa-right-from-bracket"></i></a></aside><main>${PAGES[page]()}</main>`;
if(page=='qr')drawQR()}
/* ---------- POS ---------- */
function stats(){const bt=S.tables.filter(t=>t.st=='busy'),lo=S.orders.filter(live);
return[[S.tables.filter(t=>t.st=='free'&&!t.off).length,'Bàn trống','#6f8f6b','<i class="fa-solid fa-chair"></i>'],[bt.length,'Đang có khách','#b08d4c','<i class="fa-solid fa-users"></i>'],[bt.filter(t=>{const o=tOrders(t.id);return o.length&&o.every(x=>x.status!='pending'&&act(x).every(i=>i.st=='served'))}).length,'Đã lên đủ món','#5b7f9b','<i class="fa-solid fa-check-double"></i>'],[lo.filter(o=>o.status!='pending'&&act(o).some(i=>i.st=='wait'||i.st=='cook')).length,'Đơn đang làm','#1f3350','<i class="fa-solid fa-fire-burner"></i>']]}
function shiftBar(){return S.shift?`<div class=box>Ca mở bởi <b>${esc(S.shift.by)}</b> lúc ${tm(S.shift.t)} · quỹ đầu ca ${money(S.shift.cash)} <button onclick="closeShift()">Đóng ca</button></div>`:`<div class=box class=err>Chưa mở ca. <button class=p onclick="openShift()">Mở ca</button></div>`}
function openShift(){const c=prompt('Tiền mặt đầu ca (VNĐ):','500000');if(c===null||isNaN(+c)||+c<0)return alert('Tiền đầu ca không được là số âm.');S.shift={id:'CA'+S.seq++,by:me.name,t:Date.now(),cash:+c};save();render()}
function closeShift(){const s=S.shift,cashIn=S.inv.filter(i=>i.shift==s.id).reduce((x,i)=>x+i.cashPaid,0),exp=s.cash+cashIn,c=prompt(`Kiểm đếm tiền cuối ca.\nTiền theo hệ thống: ${money(exp)}\nNhập tiền thực tế:`,exp);if(c===null||isNaN(+c)||+c<0)return alert('Số tiền thực tế không được là số âm.');const d=+c-exp;let why='';if(d)why=prompt('Chênh lệch '+money(d)+'. Nhập lý do:')||'';S.shifts.push({...s,end:Date.now(),exp,real:+c,diff:d,why,n:S.inv.filter(i=>i.shift==s.id).length});S.shift=null;save();alert('Đã đóng ca. Chênh lệch: '+money(d));render()}
function addTable(){const n=prompt('Tên bàn mới:','B'+(S.tables.length+1));if(!n)return;S.tables.push({id:Math.max(0,...S.tables.map(t=>t.id))+1,name:n,st:'free'});save();render()}
PAGES={pos(){return`<div class=stats>${stats().map(s=>`<div style="background:${s[2]}">${s[3]} <b>${s[0]}</b>${s[1]}</div>`).join('')}</div>${shiftBar()}<div class=pos><div><h4>Danh sách đơn hàng</h4>${S.orders.filter(live).slice().reverse().map(o=>`<div class=box><div class=row><b>${o.id} · Bàn ${esc(S.tables.find(t=>t.id==o.table).name)}</b><span class=tag>${tm(o.t)}</span></div><div class=tag>${o.src} · ${esc(o.by)} · ${ost(o)}</div>${act(o).map(i=>`<div class=row><span>${esc(i.name)} ×${i.qty}</span><span>${money(i.price*i.qty)}</span></div>`).join('')}<b>${money(sum(o))}</b>${o.note?`<div class=tag>Ghi chú: ${esc(o.note)}</div>`:''}${o.status=='pending'?`<button class=p onclick="confirmO('${o.id}')">Xác nhận</button>`:''}</div>`).join('')||'<p class=mut>Chưa có đơn hàng nào.</p>'}</div>
<div><div class=row><h4>Sơ đồ bàn</h4>${can('admin','manager')?'<button onclick="tblM()"><i class="fa-solid fa-plus"></i> Thêm / quản lý bàn</button>':''}</div><div class=tabs>${S.tables.filter(t=>!t.off||can('admin','manager')).map(t=>`<div class="t ${t.off?'off':t.st}" onclick="${t.off?'toast(&quot;Bàn đã bị vô hiệu hóa&quot;)':'openT('+t.id+')'}"><b>${esc(t.name)}</b><div class=tag>${t.off?'Vô hiệu hóa':TS[t.st]}</div><div>${t.st=='busy'?money(tTotal(t.id)):'&nbsp;'}</div><small>Xem chi tiết</small></div>`).join('')}</div></div></div>`}};
function confirmO(id){S.orders.find(o=>o.id==id).status='confirmed';save();render();if(cur)drawT()}
function openT(id){cur=id;cart=[];drawT()}
function drawT(){const t=S.tables.find(x=>x.id==cur),os=tOrders(cur);
modal(`<div class=row><h3>Bàn ${esc(t.name)} <small>${TS[t.st]}</small></h3><button onclick="closeM();cur=null"><i class="fa-solid fa-xmark"></i></button></div>
${t.st=='clean'?`<button class=p onclick="cleaned()">Dọn xong, trả bàn trống</button>`:''}
${os.map(o=>`<div class=box><b>${o.id}</b> <span class=tag>${o.src} · ${esc(o.by)} · ${tm(o.t)} · ${ost(o)}</span> ${o.status=='pending'?`<button class=p onclick="confirmO('${o.id}')">Xác nhận</button>`:''}${act(o).map(i=>`<div class=row><span>${esc(i.name)} ×${i.qty}${i.note?' ('+esc(i.note)+')':''}</span><span class=tag>${IS[i.st]}</span>${i.st=='wait'||i.st=='cook'?`<button class=x onclick="cancelI('${o.id}','${i.id}')">Hủy</button>`:i.st=='done'?`<button onclick="serve('${o.id}','${i.id}')">Đã phục vụ</button>`:'<span></span>'}</div>`).join('')}</div>`).join('')}
${os.length?`<b>Tạm tính: ${money(tTotal(cur))}</b>`:''}
${t.st!='clean'?`<h4>Gọi món</h4>${menuHtml('addC')}
${cart.length?`<div class=box>${cart.map((c,i)=>`<div class=row>${cartRow(c,i)}</div>`).join('')}<div class=row><b>Tạm tính giỏ</b><b>${money(cart.reduce((s,c)=>s+c.price*c.qty,0))}</b></div><input id=nt placeholder="Ghi chú chế biến" style="width:100%;margin:6px 0"><button class=p onclick="send()">Gửi bếp</button></div>`:''}`:''}
${os.length?`<div class=row style="margin-top:10px"><span><select id=mv>${S.tables.filter(x=>x.st=='free'&&!x.off).map(x=>`<option value=${x.id}>${esc(x.name)}</option>`).join('')}</select><button onclick="moveT()">Chuyển bàn</button></span><span><select id=mg>${S.tables.filter(x=>x.st=='busy'&&x.id!=cur).map(x=>`<option value=${x.id}>${esc(x.name)}</option>`).join('')}</select><button onclick="mergeT()">Gộp bàn</button></span></div><button class=p style="margin-top:8px" onclick="payM()">Thanh toán</button>`:''}`)}
function addC(id){const m=S.menu.find(x=>x.id==id),c=cart.find(x=>x.id==id);c?c.qty++:cart.push({id,name:m.name,price:m.price,qty:1});drawT()}
function send(){const n=$('#nt').value.trim(),t=S.tables.find(x=>x.id==cur);S.orders.push({id:'DH'+S.seq++,table:cur,src:'Nhân viên phục vụ',by:me.name,t:Date.now(),status:'confirmed',pay:'unpaid',note:n,items:cart.map(c=>({id:'i'+S.seq++,name:c.name,price:c.price,qty:c.qty,note:n,st:'wait'}))});t.st='busy';cart=[];save();render();drawT()}
function cancelI(o,i){const od=S.orders.find(x=>x.id==o),it=od.items.find(x=>x.id==i);if(it.st=='cook'){if(!can('admin','manager'))return alert('Món đang chế biến: cần Quản lý duyệt hủy và thông báo cho bếp.');if(!confirm('Món đang chế biến. Xác nhận hủy và báo bếp?'))return}it.st='cancel';const t=S.tables.find(x=>x.id==cur);if(!tOrders(cur).length&&t.st=='busy')t.st='free';save();render();drawT()}
function serve(o,i){S.orders.find(x=>x.id==o).items.find(x=>x.id==i).st='served';save();render();if(cur)drawT()}
function cleaned(){S.tables.find(x=>x.id==cur).st='free';save();closeM();render()}
function moveT(){const to=+$('#mv').value;if(!to)return;S.orders.filter(live).forEach(o=>{if(o.table==cur)o.table=to});S.tables.find(x=>x.id==to).st='busy';S.tables.find(x=>x.id==cur).st='free';save();closeM();render()}
function mergeT(){const f=+$('#mg').value;if(!f)return;S.orders.filter(live).forEach(o=>{if(o.table==f)o.table=cur});S.tables.find(x=>x.id==f).st='free';save();drawT();render()}
/* ---------- Thanh toán ---------- */
function calc(){const sub=tTotal(cur),d=Math.max(0,Math.min(100,+($('#dc')?.value||0))),b=sub*(1-d/100),vat=b*Math.max(0,S.cfg.vat)/100,sv=b*Math.max(0,S.cfg.svc)/100;return{sub,dv:sub-b,vat,sv,tot:Math.round(b+vat+sv)}}
function payM(){modal(`<h3>Thanh toán bàn ${esc(S.tables.find(x=>x.id==cur).name)}</h3><div id=pc></div><div class=row>Giảm giá (%) <input id=dc type=number value=0 min=0 max=100 step=any onkeydown="if(['-','+','e','E'].includes(event.key))event.preventDefault()" oninput="if(+this.value<0)this.value=0;if(+this.value>100)this.value=100;upd()"></div><div class=row>Phương thức <select id=pm onchange="upd()"><option value=cash>Tiền mặt</option><option value=transfer>Chuyển khoản</option><option value=card>Thẻ</option><option value=mixed>Hỗn hợp (tiền mặt + chuyển khoản)</option></select></div><div class=row id=cr>Tiền mặt khách đưa <input id=cs type=number min=0 step=any placeholder="0" onkeydown="if(['-','+','e','E'].includes(event.key))event.preventDefault()" oninput="if(+this.value<0)this.value=0;upd()"></div><div class=row>Chia cho số khách <input id=ng type=number value=1 min=1 step=1 onkeydown="if(['-','+','e','E'].includes(event.key))event.preventDefault()" oninput="if(+this.value<1&&this.value!=='')this.value=1;upd()"></div><div id=pt></div><div id=bq></div><button onclick="drawT()">Quay lại</button> <button class=p onclick="pay()">Xác nhận thanh toán</button>`);upd()}
function upd(){const c=calc(),m=$('#pm').value,cs=Math.max(0,+$('#cs')?.value||0),ng=Math.max(1,Math.round(+$('#ng')?.value||1));$('#cr').style.display=m=='cash'||m=='mixed'?'flex':'none';$('#pc').innerHTML=`<div class=row><span>Tạm tính</span><span>${money(c.sub)}</span></div><div class=row><span>Giảm giá</span><span>-${money(c.dv)}</span></div><div class=row><span>VAT ${S.cfg.vat}%</span><span>${money(c.vat)}</span></div><div class=row><span>Phí dịch vụ ${S.cfg.svc}%</span><span>${money(c.sv)}</span></div><div class=row><b>Tổng thanh toán</b><b>${money(c.tot)}</b></div>`;$('#pt').innerHTML=(m=='cash'?`<p>Tiền thừa: ${money(Math.max(0,cs-c.tot))}</p>`:m=='mixed'?`<p>Chuyển khoản phần còn lại: ${money(Math.max(0,c.tot-cs))}</p>`:'')+(ng>1?`<p>Mỗi khách: ${money(c.tot/ng)}</p>`:'')}
function pay(){if(!S.shift)return alert('Cần mở ca trước khi thanh toán.');const c=calc(),m=$('#pm').value,cs=Math.max(0,+$('#cs')?.value||0),os=tOrders(cur);
if(m=='cash'&&cs<c.tot)return alert('Tiền khách đưa chưa đủ.');if(m=='mixed'&&(cs<=0||cs>=c.tot))return alert('Tiền mặt phải lớn hơn 0 và nhỏ hơn tổng tiền.');
if(os.some(o=>o.status=='pending'||act(o).some(i=>i.st!='served'))&&!confirm('Còn món chưa phục vụ hoặc đơn chưa xác nhận. Vẫn thanh toán?'))return;
const cashPaid=m=='cash'?c.tot:m=='mixed'?cs:0;S.inv.push({id:'HD'+S.seq++,t:Date.now(),table:S.tables.find(x=>x.id==cur).name,items:os.flatMap(o=>act(o).map(i=>({name:i.name,qty:i.qty,price:i.price}))),...c,method:m,cashPaid,by:me.name,shift:S.shift.id});
os.forEach(o=>o.pay='paid');S.tables.find(x=>x.id==cur).st='clean';save();closeM();render();alert('Thanh toán thành công. Bàn chuyển sang trạng thái dọn dẹp.')}
/* ---------- KDS & phục vụ ---------- */
PAGES.kds=()=>{const os=S.orders.filter(o=>live(o)&&o.status!='pending'&&act(o).some(i=>i.st=='wait'||i.st=='cook'));return`<h3>Màn hình bếp</h3><div class=tabs style="grid-template-columns:repeat(auto-fill,minmax(250px,1fr))">${os.map(o=>{const w=Math.floor((Date.now()-o.t)/6e4),lt=w>=S.cfg.late;return`<div class="box ${lt?'late':''}"><div class=row><b>${o.id} · Bàn ${esc(S.tables.find(t=>t.id==o.table).name)}</b><span class=tag>${tm(o.t)}</span></div><div class=${lt?'err':'tag'}>Chờ ${w} phút${lt?' · quá thời gian':''}</div>${act(o).filter(i=>i.st=='wait'||i.st=='cook').map(i=>`<div class=row><span>${esc(i.name)} ×${i.qty}<br><small>${i.note?esc(i.note):''} · ${IS[i.st]}</small></span><span style="display:flex;gap:4px;flex-direction:column"><button class=p onclick="kds('${o.id}','${i.id}')">${i.st=='wait'?'Bắt đầu':'Xong'}</button><button class=x onclick="outIng('${o.id}','${i.id}')">Hết nguyên liệu</button></span></div>`).join('')}</div>`}).join('')||'<p class=mut>Không có đơn chờ chế biến.</p>'}</div>`};
function kds(o,i){const it=S.orders.find(x=>x.id==o).items.find(x=>x.id==i);it.st=it.st=='wait'?'cook':'done';save();render()}
PAGES.waiter=()=>{const L=S.orders.filter(live).flatMap(o=>act(o).filter(i=>i.st=='done').map(i=>[o,i]));return`<h3>Ứng dụng phục vụ</h3><h4>Món chờ mang ra bàn</h4>${L.map(([o,i])=>`<div class="box row"><span>Bàn ${esc(S.tables.find(t=>t.id==o.table).name)} · ${esc(i.name)} ×${i.qty}</span><button class=p onclick="serve('${o.id}','${i.id}')">Đã phục vụ</button></div>`).join('')||'<p class=mut>Chưa có món nào cần mang ra.</p>'}<p class=mut>Để tạo order, chuyển món, gộp bàn hoặc thanh toán, mở “Sơ đồ bàn & POS”.</p>`};
/* ---------- Thực đơn ---------- */
PAGES.menu=()=>`<h3>Quản lý thực đơn</h3><div class=box><input id=mn placeholder="Tên món"> <input id=mp type=number min=0 step=1000 placeholder="Giá" onkeydown="if(['-','+','e','E'].includes(event.key))event.preventDefault()" oninput="if(+this.value<0)this.value=0"> <input id=mc placeholder="Danh mục"> <input id=ma placeholder="Khu chế biến"> <button class=p onclick="addM()">Thêm món</button></div><div class=sc><table><tr><th>Mã</th><th>Món</th><th>Danh mục</th><th>Khu</th><th>Giá</th><th>Trạng thái</th></tr>${S.menu.map(m=>`<tr><td>${m.id}</td><td>${esc(m.name)}</td><td>${esc(m.cat)}</td><td>${esc(m.area)}</td><td>${money(m.price)}</td><td><select onchange="S.menu.find(x=>x.id=='${m.id}').st=this.value;save()"><option value=on ${m.st=='on'?'selected':''}>Đang bán</option><option value=out ${m.st=='out'?'selected':''}>Tạm hết</option><option value=hide ${m.st=='hide'?'selected':''}>Ngừng kinh doanh</option></select></td></tr>`).join('')}</table></div><p class=mut>Món đã bán không bị xóa cứng, chỉ chuyển sang ngừng kinh doanh để giữ lịch sử doanh thu.</p>`;
function addM(){const n=$('#mn').value.trim(),p=+$('#mp').value;if(!n||isNaN(p)||p<=0)return alert('Nhập tên món và giá hợp lệ (giá phải lớn hơn 0).');S.menu.push({id:'M'+(S.menu.length+1+Math.floor(Math.random()*90)),name:n,price:p,cat:$('#mc').value||'Khác',area:$('#ma').value||'Bếp',st:'on'});save();render()}
/* ---------- QR ---------- */
const qurl=id=>base()+'#qr'+id;
PAGES.qr=()=>`<div class=row><h3>Mã QR theo bàn</h3><button onclick="print()">In tất cả</button></div><div class=qrs>${S.tables.map(t=>`<div class=box><b>Bàn ${esc(t.name)}</b><div id=q${t.id} style="margin:6px 0"></div><a href="${qurl(t.id)}" target=_blank>Mở thử</a></div>`).join('')}</div><p class=mut>QR chỉ chứa số bàn, không chứa thông tin đăng nhập hay quyền quản trị.</p>`;
function drawQR(){S.tables.forEach(t=>{const e=$('#q'+t.id);if(e&&window.QRCode)new QRCode(e,{text:qurl(t.id),width:128,height:128})})}
function qrView(){const t=S.tables.find(x=>x.id==QR);if(!t)return'<div class="box login">Mã QR không hợp lệ. Vui lòng hỏi nhân viên.</div>';
const os=tOrders(t.id);return`<div class=login style="margin:2vh auto">${logo()}<h3>${esc(S.cfg.name)} · Bàn ${esc(t.name)}</h3>${menuHtml('qAdd')}${cart.length?`<div class=box>${cart.map((c,i)=>`<div class=row>${cartRow(c,i)}</div>`).join('')}<input id=qn placeholder="Ghi chú (không cay…)" style="width:100%;margin:6px 0"><input id=qt placeholder="Tên hoặc số điện thoại (tùy chọn)" style="width:100%"><button class=p style="width:100%;margin-top:6px" onclick="qSend()">Gửi order · ${money(cart.reduce((s,c)=>s+c.price*c.qty,0))}</button></div>`:''}<h4>Đơn của bàn</h4>${os.map(o=>`<div class=box><b>${o.id}</b> <span class=tag>${ost(o)}</span>${act(o).map(i=>`<div class=row><span>${esc(i.name)} ×${i.qty}</span><span class=tag>${IS[i.st]}</span></div>`).join('')}</div>`).join('')||'<p class=mut>Chưa có món nào được gửi.</p>'}</div>`}
function qAdd(id){const m=S.menu.find(x=>x.id==id),c=cart.find(x=>x.id==id);c?c.qty++:cart.push({id,name:m.name,price:m.price,qty:1});render()}
function qSend(){if(Date.now()-(window.lastQ||0)<8000)return alert('Vui lòng đợi vài giây trước khi gửi lại.');window.lastQ=Date.now();const t=S.tables.find(x=>x.id==QR),n=$('#qn').value.trim();S.orders.push({id:'DH'+S.seq++,table:t.id,src:'Khách qua QR',by:$('#qt').value.trim()||'Khách',t:Date.now(),status:S.cfg.qrAuto?'confirmed':'pending',pay:'unpaid',note:n,items:cart.map(c=>({id:'i'+S.seq++,name:c.name,price:c.price,qty:c.qty,note:n,st:'wait'}))});if(t.st!='busy')t.st='busy';cart=[];save();render();alert('Đã gửi order. Nhân viên sẽ xác nhận trong giây lát.')}
/* ---------- Báo cáo ---------- */
PAGES.report=()=>{const lim={d:864e5,w:6048e5,m:2592e6,all:1e15}[rp==='all'?'all':rp],iv=S.inv.filter(i=>Date.now()-i.t<=lim),rev=iv.reduce((s,i)=>s+i.tot,0),bm={},bi={};iv.forEach(i=>{bm[i.method]=(bm[i.method]||0)+i.tot;i.items.forEach(x=>bi[x.name]=(bi[x.name]||0)+x.qty)});const M={cash:'Tiền mặt',transfer:'Chuyển khoản',card:'Thẻ',mixed:'Hỗn hợp'};
return`<div class=row><h3>Báo cáo doanh thu</h3><span><select onchange="rp=this.value;render()">${[['d','24 giờ qua'],['w','7 ngày'],['m','30 ngày'],['all','Tất cả']].map(o=>`<option value=${o[0]} ${rp==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select> <button onclick="copyCsv()">Sao chép CSV</button> <button onclick="print()">In / PDF</button></span></div>
<div class=stats><div style="background:#1f3350"><b>${money(rev)}</b>Doanh thu</div><div style="background:#b08d4c"><b>${iv.length}</b>Số hóa đơn</div><div style="background:#5b7f9b"><b>${money(iv.length?rev/iv.length:0)}</b>Trung bình / hóa đơn</div><div style="background:#6f8f6b"><b>${money(iv.reduce((s,i)=>s+i.dv,0))}</b>Giảm giá</div></div>
<div class=box><b>Theo phương thức:</b> ${Object.entries(bm).map(([k,v])=>`${M[k]}: ${money(v)}`).join(' · ')||'—'}<br><b>VAT:</b> ${money(iv.reduce((s,i)=>s+i.vat,0))} · <b>Phí dịch vụ:</b> ${money(iv.reduce((s,i)=>s+i.sv,0))}</div>
<div class=box><b>Món bán chạy:</b> ${Object.entries(bi).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k,v])=>`${esc(k)} (${v})`).join(', ')||'—'}</div>
<div class=sc><table><tr><th>Hóa đơn</th><th>Giờ</th><th>Bàn</th><th>Thu ngân</th><th>Phương thức</th><th>Tổng</th><th></th></tr>${iv.slice().reverse().map(i=>`<tr><td>${i.id}</td><td>${new Date(i.t).toLocaleString('vi-VN')}</td><td>${esc(i.table)}</td><td>${esc(i.by)}</td><td>${M[i.method]}</td><td>${money(i.tot)}</td><td><button onclick="showBill('${i.id}')">In bill</button></td></tr>`).join('')}</table></div>
<h4>Báo cáo ca</h4>${S.shifts.map(s=>`<div class=box>${s.id} · ${esc(s.by)} · ${new Date(s.t).toLocaleString('vi-VN')} · ${s.n} hóa đơn · hệ thống ${money(s.exp)} · thực tế ${money(s.real)} · chênh lệch ${money(s.diff)} ${esc(s.why)}</div>`).join('')||'<p class=mut>Chưa có ca nào được đóng.</p>'}`};
function copyCsv(){const r=['Hóa đơn,Thời gian,Bàn,Thu ngân,Phương thức,Giảm giá,VAT,Phí dịch vụ,Tổng',...S.inv.map(i=>[i.id,new Date(i.t).toLocaleString('vi-VN'),i.table,i.by,i.method,i.dv,i.vat,i.sv,i.tot].join(','))].join('\n');try{navigator.clipboard.writeText(r);alert('Đã sao chép CSV, dán vào Excel để dùng.')}catch(e){prompt('Sao chép CSV:',r)}}
/* ---------- Nhân viên ---------- */
PAGES.staff=()=>`<h3>Quản lý nhân viên</h3><div class=box><input id=sn placeholder="Họ và tên"> <input id=su placeholder="Tên đăng nhập"> <select id=sr>${Object.entries(R).map(([k,v])=>`<option value=${k}>${v}</option>`).join('')}</select> <input id=sp type=password placeholder="Mật khẩu khởi tạo"> <button class=p onclick="addU()">Tạo tài khoản</button><div class=tag>Mật khẩu tối thiểu 8 ký tự, gồm chữ hoa, chữ thường, số và ký tự đặc biệt.</div></div><div class=sc><table><tr><th>Họ tên</th><th>Đăng nhập</th><th>Vai trò</th><th>Trạng thái</th><th>Ngày tạo</th><th></th></tr>${S.users.map((u,i)=>`<tr><td>${esc(u.name)}</td><td>${esc(u.u)}</td><td>${R[u.role]}</td><td>${{active:'Đang hoạt động',locked:'Đã khóa',off:'Đã vô hiệu hóa'}[u.st]}</td><td>${new Date(u.t).toLocaleDateString('vi-VN')}</td><td>${u.role=='admin'?'':`<button onclick="setU(${i},'${u.st=='active'?'locked':'active'}')">${u.st=='active'?'Khóa':'Mở khóa'}</button> <button class=x onclick="setU(${i},'off')">Vô hiệu hóa</button>`}</td></tr>`).join('')}</table></div>`;
function addU(){const n=$('#sn').value.trim(),u=$('#su').value.trim(),p=$('#sp').value;if(!n||!u)return alert('Nhập họ tên và tên đăng nhập.');if(S.users.some(x=>x.u==u))return alert('Tên đăng nhập đã tồn tại.');if(!/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$/.test(p))return alert('Mật khẩu chưa đạt: tối thiểu 8 ký tự, đủ chữ hoa, chữ thường, số, ký tự đặc biệt.');S.users.push({name:n,u,p,role:$('#sr').value,st:'active',t:Date.now()});save();render()}
function setU(i,s){S.users[i].st=s;save();render()}
/* ---------- Cài đặt ---------- */
PAGES.set=()=>`<h3>Cài đặt hệ thống</h3><div class=box><div class=row>Tên nhà hàng <input id=cn value="${esc(S.cfg.name)}"></div><div class=row>VAT (%) <input id=cv type=number min=0 max=100 value=${S.cfg.vat} onkeydown="if(['-','+','e','E'].includes(event.key))event.preventDefault()" oninput="if(+this.value<0)this.value=0;if(+this.value>100)this.value=100"></div><div class=row>Phí dịch vụ (%) <input id=cs2 type=number min=0 max=100 value=${S.cfg.svc} onkeydown="if(['-','+','e','E'].includes(event.key))event.preventDefault()" oninput="if(+this.value<0)this.value=0;if(+this.value>100)this.value=100"></div><div class=row>Cảnh báo đơn chậm (phút) <input id=cl type=number min=1 value=${S.cfg.late} onkeydown="if(['-','+','e','E'].includes(event.key))event.preventDefault()" oninput="if(+this.value<1&&this.value!=='')this.value=1"></div><div class=row>Tự động tiếp nhận đơn QR <input id=ca type=checkbox ${S.cfg.qrAuto?'checked':''}></div><button class=p onclick="saveCfg()">Lưu cài đặt</button></div>`;
function saveCfg(){S.cfg={name:$('#cn').value||'Nhà hàng',vat:Math.max(0,Math.min(100,+$('#cv').value||0)),svc:Math.max(0,Math.min(100,+$('#cs2').value||0)),late:Math.max(1,+$('#cl').value||10),qrAuto:$('#ca').checked};save();render();alert('Đã lưu cài đặt.')}
/* ===== Bổ sung: ca & đối soát, nhật ký, thực đơn có ảnh, logo, ngân hàng, in bill ===== */
let tmpImg='';const BK={970436:'Vietcombank',970415:'VietinBank',970418:'BIDV',970405:'Agribank',970407:'Techcombank',970422:'MB Bank',970416:'ACB',970432:'VPBank',970423:'TPBank',970403:'Sacombank'},tn=id=>(S.tables.find(t=>t.id==id)||{name:'?'}).name;
function logo(){return S.cfg.logo?`<img src="${S.cfg.logo}" style="height:44px;display:block;margin-bottom:6px">`:''}
function img(m){return m.img?`<img src="${m.img}" style="width:100%;height:60px;object-fit:cover;border-radius:6px"><br>`:''}
function rz(f,t,m,cb){if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL(t,.82))};i.src=r.result};r.readAsDataURL(f)}
function pick(el){rz(el.files[0],'image/jpeg',320,d=>tmpImg=d)}
function logA(a,d){(S.log=S.log||[]).push({t:Date.now(),by:me?me.name:'Khách (QR)',a,d:d||''});if(S.log.length>500)S.log.shift();save()}
function wrap(n,f,pre){const o=window[n];window[n]=function(...a){const b=JSON.stringify(S);if(pre)f(...a);const r=o.apply(this,a);if(!pre&&JSON.stringify(S)!==b)try{f(...a)}catch(e){}return r}}
NAV.shift=['fa-cash-register Ca & đối soát','admin,manager,waiter'];NAV.log=['fa-clock-rotate-left Nhật ký thao tác','admin,manager'];G[0][1].splice(1,0,'shift');G[2][1].push('log');
/* Ca & đối soát */
function shiftBar(){return `<div class=box>${S.shift?`Ca đang được mở | <b>${esc(S.shift.by)}</b> | ${tm(S.shift.t)}`:'<span class=err>Chưa mở ca.</span>'} <button class=p onclick="page='shift';render()">Ca & đối soát</button></div>`}
function openShift(){const c=+$('#oc').value;if(isNaN(c)||c<0)return alert('Tiền đầu ca không được là số âm.');S.shift={id:'CA'+S.seq++,by:me.name,t:Date.now(),cash:c};save();render()}
function closeShift(){const s=S.shift,iv=S.inv.filter(i=>i.shift==s.id),exp=s.cash+iv.reduce((x,i)=>x+i.cashPaid,0),r=$('#rc').value;if(r===''||isNaN(+r)||+r<0)return alert('Số tiền thực đếm không được là số âm.');const d=+r-exp,why=$('#rw').value.trim();if(d&&!why)return alert('Có chênh lệch, vui lòng nhập lý do.');S.shifts.push({...s,end:Date.now(),exp,real:+r,diff:d,why,n:iv.length,ap:false});S.shift=null;save();render()}

/* VietQR + thanh toán chuyển khoản */
function crc(s){let c=65535;for(const ch of s){c^=ch.charCodeAt(0)<<8;for(let i=0;i<8;i++)c=c&32768?((c<<1)^4129)&65535:(c<<1)&65535}return c.toString(16).toUpperCase().padStart(4,'0')}
const tl=(i,v)=>i+String(v.length).padStart(2,'0')+v;
function vietqr(b,amt,note){const m=tl('00','A000000727')+tl('01',tl('00',b.bin)+tl('01',b.acc))+tl('02','QRIBFTTA');const s=tl('00','01')+tl('01','12')+tl('38',m)+tl('53','704')+tl('54',String(Math.round(amt)))+tl('58','VN')+tl('62',tl('08',note))+'6304';return s+crc(s)}

/* Hệ thống âm thanh thông báo Web Audio API */
let sndCtx=null;
function getSndCtx(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;if(!sndCtx)sndCtx=new AC();if(sndCtx.state==='suspended')sndCtx.resume().catch(()=>{});return sndCtx}catch(_){return null}}
['click','touchstart','keydown'].forEach(e=>window.addEventListener(e,()=>{if(sndCtx&&sndCtx.state==='suspended')sndCtx.resume().catch(()=>{})},{passive:true}));
function playChime(notes){try{const ctx=getSndCtx();if(!ctx)return;const now=ctx.currentTime;notes.forEach(([f,s,d])=>{const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(f,now+s);gain.gain.setValueAtTime(0.0001,now+s);gain.gain.exponentialRampToValueAtTime(0.3,now+s+0.02);gain.gain.exponentialRampToValueAtTime(0.0001,now+s+d);osc.connect(gain);gain.connect(ctx.destination);osc.start(now+s);osc.stop(now+s+d+0.05)})}catch(_){}}
function playSoundOrder(){if(S&&S.cfg&&S.cfg.sndOrder===false)return;playChime([[523.25,0,0.35],[659.25,0.12,0.35],[783.99,0.24,0.45]])}

function renT(id){const t=S.tables.find(x=>x.id==id),n=prompt('Tên bàn:',t.name);if(!n||!n.trim())return;if(S.tables.some(x=>x.name==n.trim()&&x.id!=id))return alert('Tên bàn đã tồn tại.');t.name=n.trim();save();render();tblM()}
function delT(id){const t=S.tables.find(x=>x.id==id);if(t.st!='free'||tOrders(id).length)return alert('Không thể xóa bàn đang có khách hoặc chưa dọn.');if(!confirm('Xóa bàn '+t.name+'? Mã QR của bàn cũng sẽ bị xóa.'))return;S.tables=S.tables.filter(x=>x.id!=id);save();render();tblM()}

function qrPrint(list,title){const L=list.filter(t=>!t.off);if(!L.length)return toast('Không có mã QR nào để in.','warn');prnGo(`<h2>Mã QR đặt món theo bàn</h2><p style="margin:0 0 8px;font-size:12px">${esc(S.cfg.name)} · ${title} · ${L.length} bàn</p><div class=qp-grid>${L.map(t=>`<div class=qp-card><b>Bàn ${esc(t.name)}</b><div class=qp-qr id=prq${t.id}></div><small>Quét mã để xem thực đơn và gọi món</small></div>`).join('')}</div>`,()=>L.forEach(t=>{const el=document.getElementById('prq'+t.id);if(el&&window.QRCode)new QRCode(el,{text:qurl(t.id),width:130,height:130})}))}

function pgBar(n,sz,p,unit,key){const pc=Math.max(1,Math.ceil(n/sz));p=Math.max(0,Math.min(p||0,pc-1));return`<div class=hdf><span>Trang ${p+1}/${pc} · ${n} ${unit}</span><span class=pgs><button class=pgb ${p<=0?'disabled':''} onclick="${key}=${p-1};render()"><i class="fa-solid fa-chevron-left"></i></button><button class=pgb ${p>=pc-1?'disabled':''} onclick="${key}=${p+1};render()"><i class="fa-solid fa-chevron-right"></i></button><button class=pgb ${p>=pc-1?'disabled':''} onclick="${key}=${pc-1};render()"><i class="fa-solid fa-angles-right"></i></button></span></div>`}

return`<h3 style="margin:0 0 10px">Nhật ký thao tác</h3><div class=tb>Từ ngày <input type=date value="${lg.f}" onchange="lg.f=this.value;lg.p=0;render()"> đến <input type=date value="${lg.t}" onchange="lg.t=this.value;lg.p=0;render()"> Tháng <input type=month value="${lg.m}" onchange="lg.m=this.value;lg.p=0;render()"> <button ${lg.f||lg.t||lg.m?'':'disabled'} onclick="lg={f:'',t:'',m:'',p:0};render()">Xóa lọc</button></div><div class="rc" style="padding:0;overflow:hidden"><div class=sc><table><tr><th>Thời gian</th><th>Người thực hiện</th><th>Thao tác</th><th>Chi tiết</th></tr>${f.slice(lg.p*10,lg.p*10+10).map(l=>`<tr><td>${new Date(l.t).toLocaleString('vi-VN')}</td><td>${esc(l.by)}</td><td>${esc(l.a)}</td><td>${esc(l.d)}</td></tr>`).join('')||'<tr><td colspan=4 class=mut>Không có thao tác trong khoảng đã chọn.</td></tr>'}</table></div>${pgBar(f.length,10,lg.p,'thao tác','lg.p')}</div>`};

let qrSearchText = '', qrFilterStatus = 'all', qrFb = false;

function qrFilteredTables() {
  const q = (qrSearchText || '').trim().toLowerCase();
  const f = qrFilterStatus || 'all';
  return S.tables.filter(t => {
    const matchQ = !q || t.name.toLowerCase().includes(q) || ('bàn ' + t.name).toLowerCase().includes(q);
    const matchF = f === 'all' || (f === 'active' && !t.off) || (f === 'disabled' && t.off);
    return matchQ && matchF;
  });
}

function qrCopy(u) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(u).then(() => {
      toast('Đã sao chép liên kết vào bộ nhớ tạm!', 'ok');
    }).catch(() => prompt('Sao chép liên kết:', u));
  } else {
    prompt('Sao chép liên kết:', u);
  }
}

  const t = S.tables.find(x => x.id == id);
  if (!t) return;
  qrPrint([t], 'Bàn ' + t.name);

function qrDownloadPng(id) {
  const t = S.tables.find(x => x.id == id);
  if (!t) return;
  const qrBox = document.getElementById('q' + t.id);
  const srcCanvas = qrBox ? qrBox.querySelector('canvas') : null;
  const srcImg = qrBox ? qrBox.querySelector('img') : null;

  const canvas = document.createElement('canvas');
  const w = 600, h = 780;
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, w, h);

  ctx.strokeStyle = '#1f3350';
  ctx.lineWidth = 8;
  ctx.strokeRect(16, 16, w - 32, h - 32);

  ctx.strokeStyle = '#e3dccb';
  ctx.lineWidth = 2;
  ctx.strokeRect(26, 26, w - 52, h - 52);

  const resName = (S.cfg && S.cfg.name ? S.cfg.name : 'NHÀ HÀNG').toUpperCase();
  ctx.fillStyle = '#7b7565';
  ctx.font = '600 20px "Segoe UI", Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(resName, w / 2, 80);

  const pillW = 280, pillH = 56;
  ctx.fillStyle = '#1f3350';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect((w - pillW) / 2, 105, pillW, pillH, 999);
  else ctx.rect((w - pillW) / 2, 105, pillW, pillH);
  ctx.fill();

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 28px "Segoe UI", Arial, sans-serif';
  ctx.fillText('BÀN ' + t.name.toUpperCase(), w / 2, 144);

  ctx.fillStyle = '#1f3350';
  ctx.font = 'bold 22px "Segoe UI", Arial, sans-serif';
  ctx.fillText('QUÉT MÃ ĐẶT MÓN TẠI BÀN', w / 2, 210);

  ctx.fillStyle = '#7b7565';
  ctx.font = '16px "Segoe UI", Arial, sans-serif';
  ctx.fillText('Mở máy ảnh điện thoại hoặc Zalo để quét mã', w / 2, 238);

  const doExport = (imgElem) => {
    const qrSize = 340;
    const qrX = (w - qrSize) / 2;
    const qrY = 265;

    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#e0e0e0';
    ctx.lineWidth = 2;
    ctx.strokeRect(qrX - 10, qrY - 10, qrSize + 20, qrSize + 20);

    ctx.drawImage(imgElem, qrX, qrY, qrSize, qrSize);

    ctx.fillStyle = '#444444';
    ctx.font = '16px "Segoe UI", Arial, sans-serif';
    ctx.fillText('1. Quét mã  ·  2. Chọn món ngon  ·  3. Bấm Gửi order', w / 2, 665);

    ctx.fillStyle = '#1f3350';
    ctx.font = 'italic 16px "Segoe UI", Arial, sans-serif';
    ctx.fillText('Chúc quý khách có bữa ăn ngon miệng!', w / 2, 705);

    const a = document.createElement('a');
    a.download = 'QR_Ban_' + String(t.name).replace(/[^a-zA-Z0-9_\u00C0-\u1EF9]/g, '_') + '.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
    toast('Đã tải ảnh thẻ QR Bàn ' + t.name, 'ok');
  };

  if (srcCanvas) {
    doExport(srcCanvas);
  } else if (srcImg && srcImg.complete) {
    doExport(srcImg);
  } else {
    const tmp = document.createElement('div');
    new QRCode(tmp, { text: qurl(t.id), width: 340, height: 340 });
    setTimeout(() => {
      const c = tmp.querySelector('canvas') || tmp.querySelector('img');
      if (c) doExport(c);
    }, 100);
  }
}

function drawQR() {
  const list = S.tables;
  list.forEach(t => {
    const el = document.getElementById('q' + t.id);
    if (!el || !window.QRCode) return;
    el.innerHTML = '';
    new QRCode(el, {
      text: qurl(t.id),
      width: 150,
      height: 150,
      colorDark: '#1a2332',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M
    });
  });
}

 if(isMe(u)&&u.role=='admin'&&r!='admin')return alert('Không thể đổi chức vụ admin của chính bạn.');

/table></div>${pgBar(S.users.length,10,PG.staff,'tài khoản','PG.staff')}</div>`};
/* ===== Bổ sung v89: Chấm công — vào/ra ca, lịch sử, thống kê công, duyệt và chỉnh sửa công ===== */
const attF={uid:'',month:'',date:''};
document.head.insertAdjacentHTML('beforeend',`<style>
.attk{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

</style>`);
function attList(){S.att=S.att||[];return S.att}
function attCfg(){S.cfg.att=S.cfg.att||{start:'08:00',end:'17:00',grace:10,std:8};return S.cfg.att}
function attAdmin(){return !!me&&me.role=='admin'}
function attCanView(){return !!me&&(me.role=='admin'||me.role=='manager')}
function ymd(t){const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function hmOf(t){if(!t)return '—';const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function atOn(date,hm){const [y,m,d]=date.split('-').map(Number),[hh,mm]=hm.split(':').map(Number);return new Date(y,m-1,d,hh,mm,0,0).getTime()}
function dmy(s){const [y,m,d]=s.split('-');return d+'/'+m+'/'+y}
function fmtH(h){if(!h)return '0h00';const hh=Math.floor(h),mm=Math.round((h-hh)*60);return hh+'h'+String(mm).padStart(2,'0')}
function attCalc(r){const c=attCfg();r.late=0;r.early=0;r.hours=0;r.ot=0;
 if(r.inAt){r.late=Math.max(0,Math.round((r.inAt-atOn(r.date,c.start))/6e4))}
 if(r.outAt){r.early=Math.max(0,Math.round((atOn(r.date,c.end)-r.outAt)/6e4));r.hours=Math.max(0,(r.outAt-r.inAt)/36e5);r.ot=Math.max(0,r.hours-c.std)}
 r.hours=Math.round(r.hours*100)/100;r.ot=Math.round(r.ot*100)/100;return r}
function attOpenOf(uid){return attList().find(r=>r.uid==uid&&!r.outAt)}
function attWorkDays(month){const [y,m]=month.split('-').map(Number),last=new Date(y,m,0).getDate(),today=ymd(Date.now()),out=[];
 for(let d=1;d<=last;d++){const dt=new Date(y,m-1,d),s=ymd(dt.getTime());if(s>=today)break;if(dt.getDay()===0)continue;out.push(s)}return out}
function attAbsent(month,uid){const days=attWorkDays(month),res=[],recs=attList();
 S.users.filter(u=>u.st!='off'&&(!uid||u.u==uid)).forEach(u=>{const joined=ymd(u.t);days.forEach(d=>{if(d<joined)return;if(!recs.some(r=>r.uid==u.u&&r.date==d))res.push({uid:u.u,name:u.name,date:d})})});return res}
function attStats(month,uid){const c=attCfg(),recs=attList().filter(r=>(!uid||r.uid==uid)&&r.date.startsWith(month)&&r.outAt);
 return{days:recs.length,hours:recs.reduce((s,r)=>s+r.hours,0),late:recs.filter(r=>r.late>c.grace).length,absent:attAbsent(month,uid).length,ot:recs.reduce((s,r)=>s+r.ot,0)}}
function attStatus(r,today){const c=attCfg(),t=[];
 if(!r.outAt&&r.date<today)t.push('Quên kết thúc ca');
 if(!r.outAt&&r.date==today)t.push('Đang trong ca');
 if(r.late>c.grace)t.push('Đi muộn');
 if(r.outAt&&r.early>0)t.push('Về sớm');
 if(r.status=='manual')t.push('Xác nhận quên chấm công');
 if(r.status=='adjusted')t.push('Đã điều chỉnh');
 return t.length?t.join(', '):(r.outAt?'Đúng giờ':'—')}
function attEditInfo(r){const e=(r.edits||[]);if(!e.length)return '—';const l=e[e.length-1];return `${esc(l.by)} · ${hmOf(l.at)} ${dmy(ymd(l.at))}<br><small>${esc(l.reason)}</small>`}
function attStart(){if(!me)return;const now=Date.now(),td=ymd(now);
 if(attOpenOf(me.u))return alert('Bạn đang trong ca làm việc.');
 if(attList().some(r=>r.uid==me.u&&r.date==td&&r.outAt))return alert('Hôm nay bạn đã kết thúc ca. Liên hệ admin nếu cần điều chỉnh.');
 attList().push(attCalc({id:'AT'+(S.seq++),uid:me.u,name:me.name,date:td,inAt:now,outAt:null,src:'self',status:'open',note:'',edits:[]}));
 save();logA('Bắt đầu ca',me.name);render()}
function attEnd(){const r=me&&attOpenOf(me.u);if(!r)return alert('Bạn chưa bắt đầu ca.');
 r.outAt=Date.now();r.status='closed';attCalc(r);save();logA('Kết thúc ca',me.name);render()}
function attEditOpen(id){if(!attAdmin())return;const r=attList().find(x=>x.id==id);if(!r)return;
 dlg(`<h4 style="margin:0 0 10px">Điều chỉnh công</h4>
<div class=uf>Nhân viên<b>${esc(r.name)}</b></div>
<div class=uf>Ngày<b>${dmy(r.date)}</b></div>
<label class=uf>Giờ vào<input type=time id=ae_in value="${r.inAt?hmOf(r.inAt):''}"></label>
<label class=uf>Giờ ra (để trống nếu chưa kết thúc ca)<input type=time id=ae_out value="${r.outAt?hmOf(r.outAt):''}"></label>
<label class=uf>Lý do chỉnh sửa (bắt buộc)<input id=ae_rs></label>
<div class=row style="margin-top:10px"><button onclick="dx()">Hủy</button><button class=p onclick="attSaveEdit('${id}')">Lưu</button></div>`);
 const bx=$('#dlg>.box');if(bx)bx.style.width='min(520px,100%)'}
function attSaveEdit(id){if(!attAdmin())return;const r=attList().find(x=>x.id==id);if(!r)return;
 const vin=$('#ae_in').value,vout=$('#ae_out').value,rs=$('#ae_rs').value.trim();
 if(!vin)return alert('Nhập giờ vào.');if(!rs)return alert('Nhập lý do chỉnh sửa.');
 const from={in:r.inAt?hmOf(r.inAt):'',out:r.outAt?hmOf(r.outAt):''};
 const inAt=atOn(r.date,vin),outAt=vout?atOn(r.date,vout):null;
 if(outAt&&outAt<=inAt)return alert('Giờ ra phải sau giờ vào.');
 r.inAt=inAt;r.outAt=outAt;r.status=outAt?'adjusted':'open';
 r.edits=r.edits||[];r.edits.push({by:me.name,at:Date.now(),reason:rs,from,to:{in:vin,out:vout||''}});
 attCalc(r);save();logA('Điều chỉnh công',r.name);dx();render()}
function attManualOpen(uid,date){if(!attAdmin())return;const u=S.users.find(x=>x.u==uid);if(!u)return;const c=attCfg();
 dlg(`<h4 style="margin:0 0 10px">Xác nhận quên chấm công</h4>
<div class=uf>Nhân viên<b>${esc(u.name)}</b></div>
<div class=uf>Ngày<b>${dmy(date)}</b></div>
<label class=uf>Giờ vào<input type=time id=am_in value="${c.start}"></label>
<label class=uf>Giờ ra<input type=time id=am_out value="${c.end}"></label>
<label class=uf>Lý do xác nhận (bắt buộc)<input id=am_rs></label>
<div class=row style="margin-top:10px"><button onclick="dx()">Hủy</button><button class=p onclick="attSaveManual('${uid}','${date}')">Xác nhận</button></div>`);
 const bx=$('#dlg>.box');if(bx)bx.style.width='min(520px,100%)'}
function attSaveManual(uid,date){if(!attAdmin())return;const u=S.users.find(x=>x.u==uid);if(!u)return;
 const vin=$('#am_in').value,vout=$('#am_out').value,rs=$('#am_rs').value.trim();
 if(!vin||!vout)return alert('Nhập đủ giờ vào và giờ ra.');if(!rs)return alert('Nhập lý do xác nhận.');
 if(date>=ymd(Date.now()))return alert('Chỉ xác nhận công cho ngày đã qua.');
 const inAt=atOn(date,vin),outAt=atOn(date,vout);if(outAt<=inAt)return alert('Giờ ra phải sau giờ vào.');
 attList().push(attCalc({id:'AT'+(S.seq++),uid,name:u.name,date,inAt,outAt,src:'admin',status:'manual',note:rs,edits:[{by:me.name,at:Date.now(),reason:rs,from:null,to:{in:vin,out:vout}}]}));
 save();logA('Xác nhận quên chấm công',u.name);dx();render()}
function attSaveCfg(){if(!attAdmin())return;const c=attCfg();
 const s=$('#ac_s').value,e=$('#ac_e').value,g=Math.max(0,+$('#ac_g').value||0),hh=Math.max(1,+$('#ac_h').value||8);
 if(!s||!e||s>=e)return alert('Giờ kết thúc ca phải sau giờ vào ca.');
 c.start=s;c.end=e;c.grace=g;c.std=hh;attList().forEach(r=>attCalc(r));save();logA('Cấu hình công',s+' – '+e);render()}
function attSet(k,v){attF[k]=v;render()}
PAGES.attendance=()=>{
 const today=ymd(Date.now()),month=attF.month||today.slice(0,7),view=attCanView(),c=attCfg(),adm=attAdmin();
 const uid=view?attF.uid:me.u;

 const recs=attList().filter(r=>(!uid||r.uid==uid)&&r.date.startsWith(month)&&(!attF.date||r.date==attF.date)).sort((a,b)=>b.date.localeCompare(a.date)||a.inAt-b.inAt);

 const openRows=attList().filter(r=>!r.outAt&&r.date<today&&(!uid||r.uid==uid)).map(r=>`<tr><td>${dmy(r.date)}</td><td>${esc(r.name)}</td><td>Quên kết thúc ca (vào ${hmOf(r.inAt)})</td><td><button onclick="attEditOpen('${r.id}')">Điều chỉnh</button></td></tr>`).join('');
 const absRows=attAbsent(month,uid).slice(0,50).map(a=>`<tr><td>${dmy(a.date)}</td><td>${esc(a.name)}</td><td>Chưa có chấm công</td><td><button class=p onclick="attManualOpen('${a.uid}','${a.date}')">Xác nhận quên chấm công</button></td></tr>`).join('');
 return`<div><h3 style="margin:0 0 2px">Chấm công</h3><div class=v2-sub>Ghi nhận giờ vào ra, theo dõi đi muộn, về sớm và thống kê công</div></div>

function adminOthers(i){return S.users.filter((x,j)=>j!=i&&x.role=='admin'&&x.st=='active').length}
function isLastAdmin(i){const u=S.users[i];return !!u&&u.role=='admin'&&adminOthers(i)==0}
function staffActions(u,i){let a='';
 if(u.role=='admin'){
  if(u.st=='active'){if(!isMe(u)&&adminOthers(i)>0)a+=` <button onclick="setU(${i},'locked')">Khóa</button>`}
  else if(u.st=='locked')a+=` <button onclick="setU(${i},'active')">Mở khóa</button>`;
  else a+=` <button onclick="reU(${i})">Kích hoạt</button>`;
 }else{
  a+=u.st=='active'?` <button onclick="setU(${i},'locked')">Khóa</button>`:u.st=='locked'?` <button onclick="setU(${i},'active')">Mở khóa</button>`:` <button onclick="reU(${i})">Kích hoạt</button>`;
 }
 if(!isMe(u)){const last=isLastAdmin(i);a+=` <button class="ib x" title="${last?'Không thể xóa Admin cuối cùng':'Xóa hoặc ngừng hoạt động'}" ${last?'disabled':''} onclick="delU(${i})"><i class="fa-solid fa-trash-can"></i></button>`}
 return a}

 if(s!='active'&&u.role=='admin'&&u.st=='active'&&adminOthers(i)==0)return alert('Không thể khóa Admin cuối cùng trong hệ thống.');
 u.st=s;save();render()}
function delU(i){const u=S.users[i];if(!u)return;
 if(isMe(u))return alert('Admin không thể tự xóa tài khoản của mình.');

 if(uHasHist(u)){ask(`Tài khoản "${u.name}" đã có lịch sử hoạt động nên không thể xóa. Ngừng hoạt động tài khoản này? Tài khoản sẽ không đăng nhập được và lịch sử được giữ nguyên.`,()=>{u.st='off';save();logA('Ngừng hoạt động',u.name);render()});return}

function saveU(i){const u=S.users[i];if(!u)return;const adm=u.role=='admin';
 const n=$('#eu_n').value.trim(),ph=$('#eu_ph').value.trim(),em=$('#eu_em').value.trim(),ad=$('#eu_ad').value.trim(),np=$('#eu_p').value;
 if(!n)return alert('Nhập họ tên.');
 if(ph&&!/^[0-9+ ]{8,15}$/.test(ph))return alert('Số điện thoại không hợp lệ (8 đến 15 chữ số).');
 if(em&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em))return alert('Email không hợp lệ.');
 if(adm){
  if(np){
   if(!isMe(u))return alert('Chỉ Admin đó mới được đổi mật khẩu của mình.');
   const cp=$('#eu_cp')?$('#eu_cp').value:'';
   if(cp!==u.p)return alert('Mật khẩu hiện tại không đúng. Cần xác thực để đổi mật khẩu.');
   if(!uPolicyOk(np))return alert('Mật khẩu mới chưa đạt: tối thiểu 8 ký tự, đủ chữ hoa, chữ thường, số, ký tự đặc biệt.');
   u.p=np;
  }
  Object.assign(u,{name:n,ph,em,ad});save();logA('Sửa thông tin Admin',n);dx();render();return;
 }
 const nu=$('#eu_u').value.trim(),r=$('#eu_r').value,w=$('#eu_w').value;
 if(!nu)return alert('Nhập tên đăng nhập.');
 if(S.users.some((x,j)=>j!=i&&x.u==nu))return alert('Tên đăng nhập đã tồn tại.');
 if(np&&!uPolicyOk(np))return alert('Mật khẩu mới chưa đạt: tối thiểu 8 ký tự, đủ chữ hoa, chữ thường, số, ký tự đặc biệt.');
 Object.assign(u,{name:n,u:nu,role:r,ws:w,ph,em,ad});if(np)u.p=np;
 save();logA('Sửa tài khoản',n);dx();render()}

function staffActions(u,i){let a='';
 const lockBtn=`<button class=ib title="Khóa tài khoản" aria-label="Khóa tài khoản" onclick="setU(${i},'locked')"><i class="fa-solid fa-lock"></i></button>`;
 const unlockBtn=`<button class=ib title="Mở khóa tài khoản" aria-label="Mở khóa tài khoản" onclick="setU(${i},'active')"><i class="fa-solid fa-lock-open"></i></button>`;

 if(u.role=='admin'){
  if(u.st=='active'){if(!isMe(u)&&adminOthers(i)>0)a+=' '+lockBtn}
  else if(u.st=='locked')a+=' '+unlockBtn;

 return a}

const XL_CRC=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0}return t})();
function xlCrc(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=XL_CRC[(c^b[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function xlEsc(s){return String(s==null?'':s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[ch]))}
function xlCol(n){let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s}
function xlSheetXml(rows,widths){
 const cols=widths?`<cols>${widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')}</cols>`:'';
 const body=rows.map((row,r)=>{const cells=row.map((c,ci)=>{if(c===null||c===undefined||c==='')return '';const ref=xlCol(ci)+(r+1);const isObj=c&&typeof c=='object';const bold=isObj&&c.b;const v=isObj?c.v:c;
   if(typeof v=='number'&&isFinite(v))return `<c r="${ref}"${bold?' s="1"':''}><v>${v}</v></c>`;
   return `<c r="${ref}" t="inlineStr"${bold?' s="1"':''}><is><t xml:space="preserve">${xlEsc(v)}</t></is></c>`}).join('');
   return `<row r="${r+1}">${cells}</row>`}).join('');
 return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${cols}<sheetData>${body}</sheetData></worksheet>`}
function xlZip(files){const enc=new TextEncoder(),parts=[],cen=[];let off=0;
 const u16=v=>[v&255,(v>>>8)&255],u32=v=>[v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255];
 files.forEach(f=>{const nm=enc.encode(f.name),data=typeof f.data=='string'?enc.encode(f.data):f.data,crc=xlCrc(data),sz=data.length;
  const lh=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(sz),...u32(sz),...u16(nm.length),...u16(0)]);
  const ch=new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(sz),...u32(sz),...u16(nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]);
  parts.push(lh,nm,data);cen.push(ch,nm);off+=lh.length+nm.length+sz});
 const cenSz=cen.reduce((s,a)=>s+a.length,0);
 const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cenSz),...u32(off),...u16(0)]);
 const all=[...parts,...cen,end];const total=all.reduce((s,a)=>s+a.length,0);const out=new Uint8Array(total);let p=0;all.forEach(a=>{out.set(a,p);p+=a.length});return out}
function xlBuild(sheets){
 const safe=n=>(String(n).replace(/[\[\]\:\*\?\/\\]/g,' ').slice(0,31).trim())||'Sheet';
 const used=new Set();const names=sheets.map(s=>{const base=safe(s.name);let nm=base,k=2;while(used.has(nm.toLowerCase())){nm=base.slice(0,27)+' '+(k++)}used.add(nm.toLowerCase());return nm});
 const X='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
 const files=[];
 files.push({name:'[Content_Types].xml',data:X+`<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`});
 files.push({name:'_rels/.rels',data:X+`<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`});
 files.push({name:'xl/workbook.xml',data:X+`<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${names.map((n,i)=>`<sheet name="${xlEsc(n)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`});
 files.push({name:'xl/_rels/workbook.xml.rels',data:X+`<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`});
 files.push({name:'xl/styles.xml',data:X+`<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`});
 sheets.forEach((s,i)=>files.push({name:`xl/worksheets/sheet${i+1}.xml`,data:xlSheetXml(s.rows,s.widths)}));
 return xlZip(files)}

 const rows=[];
 rows.push([{v:'BẢNG CÔNG NHÂN VIÊN',b:true}]);

 rows.push([]);

 recs.forEach(r=>{const last=(r.edits||[]).slice(-1)[0];

async function attDownload(filename,bytes){
 let dl=null;
 if(window.claude&&typeof window.claude.use==='function'){try{dl=await window.claude.use('downloads')}catch(e){dl=null}
  if(!dl){toast('Không thể xuất tệp trong chế độ xem này.','err');return}
  try{await dl.save({filename,data:bytes});toast('Đã xuất '+filename,'ok')}
  catch(e){const code=e&&e.code;if(code=='declined')toast('Đã hủy lưu tệp.','err');else toast('Không thể lưu tệp Excel.','err')}
  return}
 const blob=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
 const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
 toast('Đã xuất '+filename,'ok')}

/* ===== Bổ sung v111: Chặn triệt để số âm trên tất cả các ô nhập số không được âm (bàn phím, dán, lăn chuột) ===== */
function isDisallowNegInput(t){
  if(!t||t.tagName!=='INPUT')return false;
  const isNum=t.type==='number'||t.inputMode==='numeric'||t.inputMode==='decimal';
  if(!isNum)return false;
  const min=t.getAttribute('min');
  if(min!==null&&!isNaN(+min))return +min>=0;
  return true;
}
document.addEventListener('keydown',function(e){
  const t=e.target;
  if(!isDisallowNegInput(t))return;
  if(e.key==='-'||e.key==='Subtract'||e.code==='NumpadSubtract'||e.code==='Minus'){
    e.preventDefault();
  }
},true);
document.addEventListener('input',function(e){
  const t=e.target;
  if(!isDisallowNegInput(t))return;
  if(t.value!==''){
    if(+t.value<0||String(t.value).includes('-')){
      const clean=String(t.value).replace(/-/g,'');
      const minAttr=t.getAttribute('min');
      const minVal=minAttr!==null&&!isNaN(+minAttr)?+minAttr:0;
      t.value=clean&&+clean>=minVal?clean:String(minVal);
    }
  }
},true);
document.addEventListener('paste',function(e){
  const t=e.target;
  if(!isDisallowNegInput(t))return;
  const text=(e.clipboardData||window.clipboardData)?.getData('text');
  if(text&&text.includes('-')){
    e.preventDefault();
    const sanitized=text.replace(/-/g,'');
    try{document.execCommand('insertText',false,sanitized)}catch(_){t.value=sanitized}
    t.dispatchEvent(new Event('input',{bubbles:true}));
  }
},true);
